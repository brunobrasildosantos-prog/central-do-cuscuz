name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Montar o projeto Android
        run: |
          A=android/app/src/main
          mkdir -p $A/java/br/com/comanda/cuscuz $A/res/values $A/res/xml $A/assets
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p $A/res/mipmap-$n; cp .github/workflows/icone.png $A/res/mipmap-$n/ic_launcher.png; done
          cp .github/workflows/index.html $A/assets/index.html
          cp .github/workflows/comanda.keystore android/comanda.keystore
          cat > android/settings.gradle <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Comanda"
          include ':app'
          XEOF
          cat > android/build.gradle <<'XEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          XEOF
          cat > android/gradle.properties <<'XEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          XEOF
          cat > android/app/build.gradle <<'XEOF'
          plugins { id 'com.android.application' }
          
          def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
          
          android {
              namespace 'br.com.comanda.cuscuz'
              compileSdk 34
              defaultConfig {
                  applicationId 'br.com.comanda.cuscuz'
                  minSdk 21
                  targetSdk 34
                  versionCode vCode
                  versionName "2.${vCode}"
              }
              signingConfigs {
                  release {
                      storeFile file('../comanda.keystore')
                      storePassword 'comanda123'
                      keyAlias 'comanda'
                      keyPassword 'comanda123'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          XEOF
          cat > $A/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          XEOF
          cat > $A/res/values/strings.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Central do Cuscuz</string>
          </resources>
          XEOF
          cat > $A/res/xml/device_filter.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="7" />
          </resources>
          XEOF
          cat > $A/java/br/com/comanda/cuscuz/MainActivity.java <<'XEOF'
          package br.com.comanda.cuscuz;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.widget.Toast;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String ACTION_USB = "br.com.comanda.cuscuz.USB_PERMISSION";
              private static final String START = "https://appassets.androidplatform.net/assets/index.html";
              private WebView web;
              private UsbManager usb;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 21) getWindow().setStatusBarColor(0xFFB8770B);
                  usb = (UsbManager) getSystemService(USB_SERVICE);

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String u = request.getUrl().toString();
                          if (u.startsWith("https://appassets.androidplatform.net/")) return false;
                          try {
                              Intent i = u.startsWith("intent:")
                                      ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME)
                                      : new Intent(Intent.ACTION_VIEW, request.getUrl());
                              startActivity(i);
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidPrinter");
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              private UsbEndpoint findOut(UsbInterface itf) {
                  for (int e = 0; e < itf.getEndpointCount(); e++) {
                      UsbEndpoint ep = itf.getEndpoint(e);
                      if (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.getDirection() == UsbConstants.USB_DIR_OUT) return ep;
                  }
                  return null;
              }

              private UsbDevice findPrinter() {
                  UsbDevice any = null;
                  for (UsbDevice d : usb.getDeviceList().values()) {
                      for (int i = 0; i < d.getInterfaceCount(); i++) {
                          UsbInterface itf = d.getInterface(i);
                          if (findOut(itf) == null) continue;
                          if (itf.getInterfaceClass() == UsbConstants.USB_CLASS_PRINTER) return d;
                          if (any == null) any = d;
                      }
                  }
                  return any;
              }

              private UsbInterface pickInterface(UsbDevice d) {
                  UsbInterface fallback = null;
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (findOut(x) == null) continue;
                      if (x.getInterfaceClass() == UsbConstants.USB_CLASS_PRINTER) return x;
                      if (fallback == null) fallback = x;
                  }
                  return fallback;
              }

              private void toast(final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private String describe(UsbDevice d) {
                  StringBuilder b = new StringBuilder();
                  b.append("VID ").append(d.getVendorId()).append(" PID ").append(d.getProductId()).append(" | ");
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      b.append("if").append(i).append(" classe ").append(x.getInterfaceClass()).append(" ep:");
                      for (int e = 0; e < x.getEndpointCount(); e++) {
                          UsbEndpoint ep = x.getEndpoint(e);
                          b.append(ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK ? "B" : "O");
                          b.append(ep.getDirection() == UsbConstants.USB_DIR_OUT ? "out " : "in ");
                      }
                      b.append("; ");
                  }
                  return b.toString();
              }

              private void askPermission(UsbDevice d) {
                  int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                  Intent it = new Intent(ACTION_USB);
                  it.setPackage(getPackageName());
                  usb.requestPermission(d, PendingIntent.getBroadcast(this, 0, it, flags));
              }

              private synchronized String send(byte[] data) {
                  UsbDevice d = findPrinter();
                  if (d == null) return "Impressora não encontrada. Confira o cabo e se ela está ligada.";
                  if (!usb.hasPermission(d)) {
                      askPermission(d);
                      return "Toque em OK pra liberar a impressora e imprima de novo.";
                  }
                  UsbInterface itf = pickInterface(d);
                  UsbEndpoint out = findOut(itf);
                  UsbDeviceConnection c = usb.openDevice(d);
                  if (c == null) return "Não consegui abrir a impressora.";
                  try {
                      if (!c.claimInterface(itf, true)) return "A impressora está ocupada.";
                      int off = 0;
                      while (off < data.length) {
                          int n = Math.min(out.getMaxPacketSize() > 0 ? out.getMaxPacketSize() * 8 : 512, data.length - off);
                          byte[] chunk = new byte[n];
                          System.arraycopy(data, off, chunk, 0, n);
                          int r = c.bulkTransfer(out, chunk, n, 5000);
                          if (r <= 0) {
                              String m = "Falha ao enviar (" + off + " de " + data.length + " bytes). " + describe(d);
                              toast(m);
                              return m;
                          }
                          off += r;
                          try { Thread.sleep(5); } catch (InterruptedException ignored) { }
                      }
                      try { Thread.sleep(400); } catch (InterruptedException ignored) { }
                      c.releaseInterface(itf);
                      toast("Enviado " + off + " bytes. " + describe(d));
                      return "ok";
                  } finally {
                      c.close();
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public String print(String b64) {
                      try {
                          return send(Base64.decode(b64, Base64.DEFAULT));
                      } catch (Exception e) {
                          return "Erro: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String status() {
                      UsbDevice d = findPrinter();
                      if (d == null) return "none";
                      return usb.hasPermission(d) ? "ok" : "noperm";
                  }

                  @JavascriptInterface
                  public void requestPermission() {
                      UsbDevice d = findPrinter();
                      if (d != null && !usb.hasPermission(d)) askPermission(d);
                  }
              }
          }
          XEOF

      - name: Montar o APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../central-do-cuscuz.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Central do Cuscuz v${{ github.run_number }}
          files: central-do-cuscuz.apk
          make_latest: true
