name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Atualizar o app
        run: |
          cat > /tmp/patch.json <<'XEOF'
          [["   ${st.print==='app'?`<button class=\"btn dark\" data-act=\"appPerm\">Permitir acesso à impressora</button>`:''}", "   ${st.print==='app'?`<button class=\"btn dark\" data-act=\"appPerm\">Permitir acesso à impressora</button>`:''}\n   ${st.print==='app'&&APP?`<div class=\"field\"><span class=\"label\">Diagnóstico da impressora</span><pre id=\"diag\" style=\"white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;font-family:var(--f-mono)\">${esc(diagText())}</pre><div class=\"two\"><button class=\"btn\" data-act=\"diagTxt\">Teste só texto</button><button class=\"btn\" data-act=\"diagRef\">Atualizar</button></div></div>`:''}"], ["function appPrint(L){", "function diagText(){try{return window.AndroidPrinter.info()}catch(e){return 'Erro: '+e.message}}\nfunction diagShow(r){const el=document.getElementById('diag');if(el)el.textContent=(r?'Resultado: '+r+'\\n\\n':'')+diagText()}\nfunction appPrint(L){"], ["    if(m==='app'){const r=appPrint(L);toast(r==='ok'?label+' impressa':r);updatePill();return r}", "    if(m==='app'){const r=appPrint(L);toast(r==='ok'?label+' enviada':r);updatePill();diagShow(r);return r}"], ["  if(a==='appPerm'){", "  if(a==='diagTxt'){let r;try{r=window.AndroidPrinter.printText('TESTE SIMPLES\\nCentral do Cuscuz\\n1234567890')}catch(e){r='Erro: '+e.message}diagShow(r);return}\n  if(a==='diagRef'){diagShow('');return}\n  if(a==='appPerm'){"], ["data-act=\"reprint\" data-v=\"${o.id}\">Comanda</button></span></div>", "data-act=\"reprint\" data-v=\"${o.id}\">Comanda</button>${delPending===o.id?`<button class=\"btn danger\" style=\"padding:6px 10px;font-size:13px;background:var(--danger);color:#fff\" data-act=\"delYes\" data-v=\"${o.id}\">Confirmar</button>`:`<button class=\"btn danger\" style=\"padding:6px 10px;font-size:13px\" data-act=\"delOrder\" data-v=\"${o.id}\" aria-label=\"Excluir pedido\">Excluir</button>`}</span></div>${delPending===o.id?`<div class=\"note\" style=\"color:var(--danger)\">Excluir o pedido ${esc(ordLabel(o))}? Toque em Confirmar. Isso não pode ser desfeito.</div>`:''}"], ["let payMesa=null,payTotal=0,payTitle='';", "let payMesa=null,payTotal=0,payTitle='',delPending=null;"], ["  if(a==='contaDetail')return openConta(v);", "  if(a==='contaDetail'){delPending=null;return openConta(v)}\n  if(a==='delOrder'){const o=S.orders.find(o=>o.id===v);if(!o)return;delPending=v;openConta(keyOf(o));return}\n  if(a==='delYes'){const o=S.orders.find(o=>o.id===v);if(!o)return;const k=keyOf(o);S.orders=S.orders.filter(x=>x.id!==v);delPending=null;save();render();if(ordersByKey(k).length)openConta(k);else closeSheet();toast('Pedido '+ordLabel(o)+' excluído');return}"], ["  if(a==='mesaDetail')return openMesa(+v);", "  if(a==='mesaDetail'){delPending=null;return openMesa(+v)}"], ["function ticketKitchen(o){return ticketBody(o,false)}", "function ticketKitchen(o){return ticketBody({...o,items:o.items.filter(l=>!catOf(l.cat).bar)},false)}"], ["  if(atd){sendToKitchen(o);toast('Pedido enviado');return}", "  const barOnly=o.items.every(l=>catOf(l.cat).bar);\n  if(barOnly&&!atd){toast('Lançado na conta · '+placeName(o));return}\n  if(atd){sendToKitchen(o);toast(barOnly?'Bebida enviada pro caixa':'Pedido enviado');return}"], ["'Enviar pra cozinha'+(S.settings.autoPrint?' e imprimir':'')", "(cart.length&&cart.every(l=>catOf(l.cat).bar)?(S.settings.role==='atendente'?'Enviar pro caixa (bebida)':'Lançar na conta (não vai pra cozinha)'):'Enviar pra cozinha'+(S.settings.autoPrint?' e imprimir':''))"], ["S.settings.code&&o.kitchen!=='impresso'?", "S.settings.code&&o.kitchen&&o.kitchen!=='impresso'?"], ["const keyOf=o=>o.mesa===0?", "const keyOf=o=>o.conta||(o.mesa===0?"], ["'m:'+o.mesa;\nconst ordersByKey", "'m:'+o.mesa);\nconst ordersByKey"], ["let cliName='';", "let cliName='',pendingConta=null;\nfunction balcaoPick(){const bk=[...new Set(S.orders.filter(o=>o.status==='aberto'&&o.mesa===0).map(keyOf))];if(!bk.length)return '';return `<div class=\"field\"><span class=\"label\">Juntar com uma conta do balcão?</span><div class=\"chips\"><button class=\"chip ${!pendingConta?'on':''}\" data-act=\"pickConta\" data-v=\"\">Nova conta</button>${bk.map(k=>{const os=ordersByKey(k);const t=os.reduce((a,o)=>a+orderTotal(o),0);return `<button class=\"chip ${pendingConta===k?'on':''}\" data-act=\"pickConta\" data-v=\"${esc(k)}\">${esc(placeName(os[0]).replace('Balcão · ','').replace('Balcão ',''))} · ${brl(t)}</button>`}).join('')}</div></div>`}"], ["  if(a==='addMore'){if(v.startsWith('m:'))mesa=+v.slice(2);else{mesa=0;const o=ordersByKey(v)[0];cliName=o&&o.cli||''}", "  if(a==='addMore'){if(v.startsWith('m:')){mesa=+v.slice(2);pendingConta=null}else{mesa=0;const o=ordersByKey(v)[0];cliName=o&&o.cli||'';pendingConta=v}"], ["cli:mesa===0?cliName.trim().slice(0,18):'',", "cli:mesa===0?cliName.trim().slice(0,18):'',conta:mesa===0&&pendingConta?pendingConta:undefined,"], ["  cart=[];ret=false;cliName='';", "  cart=[];ret=false;cliName='';pendingConta=null;"], ["  ${mesa===0?`<div class=\"field\"><label class=\"label\" for=\"cliIn\">", "  ${mesa===0?balcaoPick():''}\n  ${mesa===0?`<div class=\"field\"><label class=\"label\" for=\"cliIn\">"], ["  if(a==='cartMesa'){mesa=+v;openCart();render();return}", "  if(a==='cartMesa'){mesa=+v;if(mesa!==0)pendingConta=null;openCart();render();return}\n  if(a==='pickConta'){pendingConta=v||null;if(pendingConta){const o=ordersByKey(pendingConta)[0];cliName=o&&o.cli||''}openCart();render();return}"], ["  if(a==='mesa'){mesa=+v;render();return}", "  if(a==='mesa'){mesa=+v;if(mesa!==0)pendingConta=null;render();return}"], ["function compact(o){return{i:o.id,s:o.seq,m:o.mesa,a:o.at,b:o.by||'',c:o.cli||'',", "function compact(o){return{i:o.id,s:o.seq,m:o.mesa,a:o.at,b:o.by||'',c:o.cli||'',k:o.conta||'',"], ["function expand(c){return{id:c.i,seq:c.s,mesa:c.m,at:c.a,by:c.b||'',cli:c.c||'',", "function expand(c){return{id:c.i,seq:c.s,mesa:c.m,at:c.a,by:c.b||'',cli:c.c||'',conta:c.k||undefined,"], ["  L.forEach(x=>{b.push(0x1B,0x61,x.center?1:0);b.push(0x1B,0x45,(x.bold||x.big)?1:0);b.push(0x1D,0x21,x.big?0x11:0x00);enc(x.t);b.push(0x0A)});\n  b.push(0x1B,0x61,0,0x1D,0x21,0,0x1B,0x45,0,0x1B,0x64,4,0x1D,0x56,0x42,0x00);return new Uint8Array(b)}", "  let al=-1,md=-1;L.forEach(x=>{const a=x.center?1:0,m=x.big?0x38:(x.bold?0x08:0);if(a!==al){b.push(0x1B,0x61,a);al=a}if(m!==md){b.push(0x1B,0x21,m);md=m}enc(x.t);b.push(0x0A)});\n  b.push(0x1B,0x21,0,0x1B,0x61,0,0x0A,0x0A,0x0A,0x0A);return new Uint8Array(b)}"]]
          XEOF
          python3 - <<'XEOF'
          import json
          p='.github/workflows/index.html'
          s=open(p,encoding='utf-8').read()
          for a,b in json.load(open('/tmp/patch.json',encoding='utf-8')):
              if a in s and b not in s: s=s.replace(a,b,1)
          open(p,'w',encoding='utf-8').write(s)
          print('ok', 'diagText' in s)
          XEOF

      - name: Montar o projeto Android
        run: |
          A=android/app/src/main
          mkdir -p $A/java/br/com/comanda/cuscuz $A/res/values $A/res/xml $A/assets
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p $A/res/mipmap-$n; cp .github/workflows/icone.png $A/res/mipmap-$n/ic_launcher.png; done
          cp .github/workflows/index.html $A/assets/index.html
          cp .github/workflows/comanda.keystore android/comanda.keystore
          cat > android/settings.gradle <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Comanda"
          include ':app'
          XEOF
          cat > android/build.gradle <<'XEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          XEOF
          cat > android/gradle.properties <<'XEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          XEOF
          cat > android/app/build.gradle <<'XEOF'
          plugins { id 'com.android.application' }
          
          def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
          
          android {
              namespace 'br.com.comanda.cuscuz'
              compileSdk 34
              defaultConfig {
                  applicationId 'br.com.comanda.cuscuz'
                  minSdk 21
                  targetSdk 34
                  versionCode vCode
                  versionName "2.${vCode}"
              }
              signingConfigs {
                  release {
                      storeFile file('../comanda.keystore')
                      storePassword 'comanda123'
                      keyAlias 'comanda'
                      keyPassword 'comanda123'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          XEOF
          cat > $A/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          XEOF
          cat > $A/res/values/strings.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Central do Cuscuz</string>
          </resources>
          XEOF
          cat > $A/res/xml/device_filter.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="7" />
          </resources>
          XEOF
          cat > $A/java/br/com/comanda/cuscuz/MainActivity.java <<'XEOF'
          package br.com.comanda.cuscuz;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.widget.Toast;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String ACTION_USB = "br.com.comanda.cuscuz.USB_PERMISSION";
              private static final String START = "https://appassets.androidplatform.net/assets/index.html";
              private WebView web;
              private volatile String last = "nenhuma impressão ainda";
              private UsbManager usb;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 21) getWindow().setStatusBarColor(0xFFB8770B);
                  usb = (UsbManager) getSystemService(USB_SERVICE);

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String u = request.getUrl().toString();
                          if (u.startsWith("https://appassets.androidplatform.net/")) return false;
                          try {
                              Intent i = u.startsWith("intent:")
                                      ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME)
                                      : new Intent(Intent.ACTION_VIEW, request.getUrl());
                              startActivity(i);
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidPrinter");
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  try {
                      UsbDevice d = findPrinter();
                      if (d != null && !usb.hasPermission(d)) askPermission(d);
                  } catch (Exception ignored) { }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              private UsbEndpoint findOut(UsbInterface itf) {
                  for (int e = 0; e < itf.getEndpointCount(); e++) {
                      UsbEndpoint ep = itf.getEndpoint(e);
                      if (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.getDirection() == UsbConstants.USB_DIR_OUT) return ep;
                  }
                  return null;
              }

              private UsbDevice findPrinter() {
                  UsbDevice any = null;
                  for (UsbDevice d : usb.getDeviceList().values()) {
                      for (int i = 0; i < d.getInterfaceCount(); i++) {
                          UsbInterface itf = d.getInterface(i);
                          if (findOut(itf) == null) continue;
                          if (itf.getInterfaceClass() == UsbConstants.USB_CLASS_PRINTER) return d;
                          if (any == null) any = d;
                      }
                  }
                  return any;
              }

              private UsbInterface pickInterface(UsbDevice d) {
                  UsbInterface fallback = null;
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      if (findOut(x) == null) continue;
                      if (x.getInterfaceClass() == UsbConstants.USB_CLASS_PRINTER) return x;
                      if (fallback == null) fallback = x;
                  }
                  return fallback;
              }

              private void toast(final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private String describe(UsbDevice d) {
                  StringBuilder b = new StringBuilder();
                  b.append("VID ").append(d.getVendorId()).append(" PID ").append(d.getProductId()).append(" | ");
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface x = d.getInterface(i);
                      b.append("if").append(i).append(" classe ").append(x.getInterfaceClass()).append(" ep:");
                      for (int e = 0; e < x.getEndpointCount(); e++) {
                          UsbEndpoint ep = x.getEndpoint(e);
                          b.append(ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK ? "B" : "O");
                          b.append(ep.getDirection() == UsbConstants.USB_DIR_OUT ? "out " : "in ");
                      }
                      b.append("; ");
                  }
                  return b.toString();
              }

              private void askPermission(UsbDevice d) {
                  int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                  Intent it = new Intent(ACTION_USB);
                  it.setPackage(getPackageName());
                  usb.requestPermission(d, PendingIntent.getBroadcast(this, 0, it, flags));
              }

              private synchronized String send(byte[] data) {
                  UsbDevice d = findPrinter();
                  if (d == null) return "Impressora não encontrada. Confira o cabo e se ela está ligada.";
                  if (!usb.hasPermission(d)) {
                      askPermission(d);
                      return "Toque em OK pra liberar a impressora e imprima de novo.";
                  }
                  UsbInterface itf = pickInterface(d);
                  UsbEndpoint out = findOut(itf);
                  UsbDeviceConnection c = usb.openDevice(d);
                  if (c == null) return "Não consegui abrir a impressora.";
                  try {
                      if (!c.claimInterface(itf, true)) return "A impressora está ocupada.";
                      if (Build.VERSION.SDK_INT >= 21) { try { c.setInterface(itf); } catch (Exception ignored) { } }
                      int off = 0;
                      while (off < data.length) {
                          int n = Math.min(out.getMaxPacketSize() > 0 ? out.getMaxPacketSize() : 64, data.length - off);
                          byte[] chunk = new byte[n];
                          System.arraycopy(data, off, chunk, 0, n);
                          int r = c.bulkTransfer(out, chunk, n, 5000);
                          if (r <= 0) {
                              String m = "Falha ao enviar (" + off + " de " + data.length + " bytes). " + describe(d);
                              last = m;
                              return m;
                          }
                          off += r;
                          try { Thread.sleep(12); } catch (InterruptedException ignored) { }
                      }
                      try { Thread.sleep(400); } catch (InterruptedException ignored) { }
                      c.releaseInterface(itf);
                      last = "Enviado " + off + " de " + data.length + " bytes pela " + describe(d);
                      return "ok";
                  } finally {
                      c.close();
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public String print(String b64) {
                      try {
                          return send(Base64.decode(b64, Base64.DEFAULT));
                      } catch (Exception e) {
                          return "Erro: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String printText(String text) {
                      try {
                          return send((text + "\n\n\n\n\n").getBytes("US-ASCII"));
                      } catch (Exception e) {
                          return "Erro: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String info() {
                      StringBuilder b = new StringBuilder();
                      int n = 0;
                      for (UsbDevice d : usb.getDeviceList().values()) {
                          n++;
                          b.append("Aparelho ").append(n).append(": ").append(describe(d))
                           .append(usb.hasPermission(d) ? " [liberado]" : " [SEM permissão]").append("\n");
                      }
                      if (n == 0) b.append("Nenhum aparelho USB encontrado. Confira cabo, adaptador e se a impressora está ligada.\n");
                      UsbDevice p = findPrinter();
                      if (p != null) {
                          UsbInterface itf = pickInterface(p);
                          b.append("Vou usar: interface classe ").append(itf.getInterfaceClass()).append("\n");
                      }
                      b.append("Última impressão: ").append(last);
                      return b.toString();
                  }

                  @JavascriptInterface
                  public String status() {
                      UsbDevice d = findPrinter();
                      if (d == null) return "none";
                      return usb.hasPermission(d) ? "ok" : "noperm";
                  }

                  @JavascriptInterface
                  public void requestPermission() {
                      UsbDevice d = findPrinter();
                      if (d != null && !usb.hasPermission(d)) askPermission(d);
                  }
              }
          }
          XEOF

      - name: Montar o APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../central-do-cuscuz.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Central do Cuscuz v${{ github.run_number }}
          files: central-do-cuscuz.apk
          make_latest: true
