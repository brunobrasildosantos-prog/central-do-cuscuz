<style>
/* Central Cuscuzeira v7 — tela inicial = mesas coloridas; todo celular vê e controla tudo */
:root{

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}

.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.btn{border-radius:14px;padding:13px 16px;font-weight:800;background:#fff;border:2px solid var(--line);min-height:48px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--brown);border-color:var(--brown);color:#fff}

.mesa.paid{background:var(--ok);border-color:var(--ok);color:#fff}

.back{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;min-height:46px;white-space:nowrap}
.otitle{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--brown)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:12px;padding:11px 4px;font-weight:800;font-size:15px}
.cats button.on{background:var(--c);color:#fff}
.quick{display:flex;gap:8px}
.quick input{font-size:20px;font-weight:800;text-align:center;max-width:104px;font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden}

.mi:last-child{border-bottom:0}

.mi .nm{font-weight:700;line-height:1.25;min-width:0}
.mi .pr{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px;line-height:1.5}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));z-index:5}

.big{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.line-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}

.mods{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}

.field{display:flex;flex-direction:column;gap:6px}

{const st=S.settings;st.dev=st.dev||rid();st.code=st.code||'';st.name=st.name||'';st.station=st.station||'';st.cols=st.cols||32;st.tables=st.tables||12;st.store=st.store||'Cuscuz Recheado';

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- comandas (texto) ----------
const W=()=>S.settings.print==='browser'?24:(S.settings.cols||32);
const plain=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'');
function wrap(text,w,indent=''){const out=[];let line='';for(const word of plain(text).split(' ')){if((line+(line?' ':'')+word).length>w){if(line)out.push(line);line=indent+word}else line+=(line?' ':'')+word}if(line)out.push(line);return out}
function lr(l,r,w=W()){l=plain(l);r=plain(r);const sp=w-l.length-r.length;return sp>=1?l+' '.repeat(sp)+r:l.slice(0,w-r.length-1)+' '+r}
const rule=()=>'-'.repeat(W());
function itemLines(l){const out=[];const head=`${l.qty}x ${l.id} ${catOf(l.cat).prefix} ${l.name}`;
  wrap(head,W()-10).forEach((s,i)=>out.push({t:i===0?lr(s,brl(lineTotal(l))):s}));
  if(l.rm.length)wrap('SEM: '+l.rm.join(', '),W()-3).forEach(s=>out.push({t:'   '+s.trim()}));
  if(l.add.length)wrap('COM: '+l.add.map(a=>a.name).join(', '),W()-3).forEach(s=>out.push({t:'   '+s.trim()}));
  if(l.obs)wrap('OBS: '+l.obs,W()-3).forEach(s=>out.push({t:'   '+s.trim()}));
  return out}
function itemShort(l){const mods=[];
  if(l.rm.length)mods.push('sem '+l.rm.join(', ').toLowerCase());
  if(l.add.length)mods.push('+ '+l.add.map(x=>x.name.toLowerCase()).join(', '));
  if(l.obs)mods.push(l.obs);
  const base=(l.cat==='C'||l.cat==='T')?'N= '+l.num:(l.cat==='R'?'Rendada '+l.name:l.name);
  return (l.qty>1?l.qty+'x ':'')+base+(mods.length?' ('+mods.join('; ')+')':'')}
function ticketBody(o){const L=[];
  {const pn=plain(placeName(o).replace(' · ',' - ')).toUpperCase();L.push({t:pn,big:pn.length<=16,bold:true})}
  L.push({t:hhmm(o.at)+(o.by?' - '+plain(o.by):'')+'  #'+String(o.seq).padStart(3,'0')});
  L.push({t:''});
  const put=l=>wrap(itemShort(l),W(),'   ').forEach(x=>L.push({t:x,bold:true}));
  const here=o.items.filter(l=>!l.ret),go=o.items.filter(l=>l.ret);
  if(here.length&&go.length){L.push({t:'COMER AQUI',big:true});here.forEach(put);L.push({t:''});L.push({t:'PRA LEVAR',big:true});go.forEach(put)}
  else o.items.forEach(put);
  L.push({t:''});
  if(go.length&&!here.length)L.push({t:'PRA LEVAR',big:true});
  return L}
const ticketKitchen=ticketBody;
function ticketPaid(os,p,recv){const items=os.flatMap(o=>o.items);const tot=items.reduce((a,l)=>a+lineTotal(l),0);
  const L=ticketBody({...os[0],at:Date.now(),by:'',items});
  L.push({t:lr('VALOR',brl(tot)),bold:true});L.push({t:lr('PAGO NO',plain(p).toUpperCase()),bold:true});
  if(p==='Dinheiro'&&recv>0&&recv>=tot){L.push({t:lr('Recebido',brl(recv))});L.push({t:lr('Troco',brl(recv-tot))})}
  return L}
function ticketBill(title,orders){const L=[];
  L.push({t:plain(S.settings.store).toUpperCase(),center:true,bold:true});
  L.push({t:'CONTA - '+plain(title).toUpperCase(),center:true});
  L.push({t:new Date().toLocaleString('pt-BR').slice(0,17),center:true});
  L.push({t:rule()});
  let tot=0;orders.forEach(o=>o.items.forEach(l=>{L.push(...itemLines(l));tot+=lineTotal(l)}));
  L.push({t:rule()});L.push({t:lr('TOTAL',brl(tot)),bold:true});
  L.push({t:''});L.push({t:'Obrigado e volte sempre!',center:true});return L}
function ticketDay(sum){const L=[{t:'RESUMO DO DIA',center:true,bold:true},{t:new Date().toLocaleDateString('pt-BR'),center:true},{t:rule()}];
  L.push({t:lr('Pedidos',String(sum.count))});
  Object.entries(sum.by).forEach(([k,v])=>L.push({t:lr(k,brl(v))}));
  L.push({t:rule()});L.push({t:lr('TOTAL RECEBIDO',brl(sum.paid)),bold:true});
  if(sum.open)L.push({t:lr('Em aberto',brl(sum.open))});return L}
function linesToHTML(L){return L.map(x=>{let t=esc(x.t);if(x.center){const p=Math.max(0,Math.floor((W()-(x.big?x.t.length*2:x.t.length))/2));t=' '.repeat(p)+t}return x.big?'<span class="bg">'+t+'</span>':x.bold?'<b>'+t+'</b>':t}).join('\n')}
function escpos(L,noInit){const b=noInit?[]:[0x1B,0x40];const enc=s=>{for(const ch of plain(s))b.push(ch.charCodeAt(0))};
  let al=-1,md=-1;L.forEach(x=>{const a=x.center?1:0,m=x.big?0x38:(x.bold?0x08:0);if(a!==al){b.push(0x1B,0x61,a);al=a}if(m!==md){b.push(0x1B,0x21,m);md=m}enc(x.t);b.push(0x0A)});
  b.push(0x1B,0x21,0,0x1B,0x61,0,0x0A,0x0A,0x0A,0x0A);return new Uint8Array(b)}
function toB64(bytes){let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)}

// ---------- impressora ----------
let usb={dev:null,ep:null};
const nap=ms=>new Promise(r=>setTimeout(r,ms));
async function usbSend(bytes){const pre=[0x1B,0x40];while(pre.length+3<=64)pre.push(0x1B,0x21,0);while(pre.length<64)pre.push(0);
  await usb.dev.transferOut(usb.ep,new Uint8Array(pre));await nap(250);
  for(let i=0;i<bytes.length;i+=64){await usb.dev.transferOut(usb.ep,bytes.slice(i,i+64));await nap(10)}}
async function usbOpen(d){await d.open();if(d.configuration===null)await d.selectConfiguration(1);
  for(const itf of d.configuration.interfaces){for(const alt of itf.alternates){const ep=alt.endpoints.find(e=>e.direction==='out');if(ep){try{await d.claimInterface(itf.interfaceNumber)}catch(e){continue}usb={dev:d,ep:ep.endpointNumber};return true}}}
  throw new Error('Saída de impressão não encontrada')}
async function usbConnect(){if(!navigator.usb){toast('Este navegador não imprime por USB. Use o Google Chrome.');return}
  try{const d=await navigator.usb.requestDevice({filters:[]});await usbOpen(d);toast('Impressora USB conectada');render();pump()}catch(e){toast('Não conectou: '+(e.message||e))}}
if(navigator.usb){navigator.usb.getDevices().then(ds=>{if(ds[0])return usbOpen(ds[0]).then(()=>{paintTop();pump()})}).catch(()=>{});
  try{navigator.usb.addEventListener('disconnect',()=>{usb={dev:null,ep:null};paintTop()})}catch(e){}}
// estado: 'off' (este celular não imprime) | 'ok' | 'none' (não achou) | 'perm' (falta liberar)
function prStatus(){const m=S.settings.print;if(!hasPrinter())return 'off';
  if(m==='app'){if(!APP)return 'none';try{const s=window.AndroidPrinter.status();return s==='ok'?'ok':(s==='none'?'none':'perm')}catch(e){return 'none'}}
  if(m==='usb')return usb.dev?'ok':'none';
  return 'ok'}
async function doPrint(L){const m=S.settings.print;
  if(m==='app'){if(!APP)return 'Abra pelo aplicativo instalado no celular';return String(window.AndroidPrinter.print(toB64(escpos(L,true))))}
  if(m==='usb'){if(!usb.dev)return 'Impressora USB não conectada';await usbSend(escpos(L,true));return 'ok'}
  if(m==='rawbt'){const url='intent:base64,'+toB64(escpos(L))+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';const a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();a.remove();return 'ok'}
  if(m==='browser'){$('#printArea').innerHTML=linesToHTML(L);window.print();return 'ok'}
  return 'Impressão desligada'}
// fila: nada se perde; se a impressora falhar, tenta de novo sozinho
let printing=false,pErr='',permAsked=false;
function enqueue(L,label,ack){if(!hasPrinter())return false;S.pq.push({id:rid(),L,label,ack:ack||'',at:Date.now()});save();pump();return true}
async function pump(){if(printing||!S.pq.length)return;
  const st=prStatus();
  if(st==='off'){S.pq=[];save();return}
  if(st!=='ok'){const msg=st==='perm'?'Falta liberar a impressora':'Impressora desligada ou cabo solto';
    if(st==='perm'&&!permAsked&&APP){permAsked=true;try{window.AndroidPrinter.requestPermission()}catch(e){}}
    if(st==='none')permAsked=false;
    if(pErr!==msg){pErr=msg;paintTop()}return}
  printing=true;const j=S.pq[0];let r;try{r=await doPrint(j.L)}catch(e){r='Erro: '+(e.message||e)}
  printing=false;
  if(r==='ok'){const i=S.pq.findIndex(x=>x.id===j.id);if(i>=0)S.pq.splice(i,1);pErr='';permAsked=false;save();if(j.ack)emit({t:'k',id:j.ack});paint();if(S.pq.length)setTimeout(pump,500)}
  else{r=String(r||'Falha ao imprimir');if(pErr!==r){pErr=r;paintTop()}}}
let actx=null;
function beep(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();[0,.28].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=t?1175:880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.35,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.25);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.26)})}catch(e){}}

// ---------- ligação entre os celulares (ntfy.sh) ----------
// Tudo que acontece vira um "aviso" (evento). Todos os celulares aplicam os mesmos avisos e ficam iguais.
// o=pedido novo · p=pago · f=liberou · d=excluiu · k=cozinha imprimiu · r=imprimir de novo na cozinha · b=imprimir conta no caixa · z=fechou o dia
const NTFY=window.NTFY_BASE||'https://ntfy.sh/';
let es=null,online=false,flushing=false,outErr='',conn=0;
const topic=()=>'cuscuzeira-'+S.settings.code;
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let c='';crypto.getRandomValues(new Uint8Array(6)).forEach(x=>c+=a[x%a.length]);return c}
function compact(o){return{i:o.id,s:o.seq,m:o.mesa,a:o.at,b:o.by||'',c:o.cli||'',k:o.conta||'',it:o.items.map(l=>[l.id,l.cat,l.name,l.qty,l.rm,l.add.map(x=>[x.name,x.price]),l.obs,l.price,l.num,l.ret?1:0])}}
function expand(c){return{id:c.i,seq:c.s,mesa:c.m,at:c.a,by:c.b||'',cli:c.c||'',conta:c.k||undefined,items:c.it.map(([id,cat,name,qty,rm,add,obs,price,num,r])=>({ret:!!r,id,num:num||parseInt(String(id).slice(1)),cat,name,qty,rm:rm||[],add:(add||[]).map(a=>({name:a[0],price:a[1]})),obs:obs||'',price:price||0}))}}
function emit(ev){ev.e=rid();ev.d=S.settings.dev;apply(ev,true,false);if(linked()){S.out.push(ev);save();flush()}}
function apply(ev,local,hist){
  if(!ev||typeof ev!=='object'||!ev.e||!ev.t||S.seen.includes(ev.e))return;
  S.seen.push(ev.e);if(S.seen.length>900)S.seen.splice(0,300);
  const t=ev.t;
  if(t==='o'){
    if(!ev.o||ev.o.a<=S.zAt||S.orders.some(o=>o.id===ev.o.i))return;
    const o=expand(ev.o);o.status='aberto';o.pay=null;o.kp=false;S.orders.push(o);S.seq=Math.max(S.seq,o.seq||0);
    if(!hist&&hasK()&&Date.now()-o.at<3*3600e3){if(enqueue(ticketKitchen(o),'Pedido '+ordLabel(o),o.id))beep()}
    if(!local&&!hist)toast('Pedido novo · '+placeName(o));
  }else if(t==='p'){
    const os=S.orders.filter(o=>(ev.ids||[]).includes(o.id)&&o.status==='aberto');if(!os.length)return;
    os.forEach(o=>{o.status='pago';o.pay=ev.p;o.paidAt=ev.at||Date.now();o.freed=false});
    if(!hist&&hasC())enqueue(ticketPaid(os,ev.p,ev.recv||0),'Via do caixa');
    if(!local&&!hist)toast(placeName(os[0])+' pagou no '+ev.p);
  }else if(t==='f'){S.orders.forEach(o=>{if((ev.ids||[]).includes(o.id)&&o.status==='pago')o.freed=true});
  }else if(t==='d'){S.orders=S.orders.filter(o=>o.id!==ev.id);S.pq=S.pq.filter(j=>j.ack!==ev.id);
  }else if(t==='k'){const o=S.orders.find(o=>o.id===ev.id);if(o)o.kp=true;
  }else if(t==='r'){const o=S.orders.find(o=>o.id===ev.id);if(o&&!hist&&hasK()&&!S.pq.some(j=>j.ack===o.id))enqueue(ticketKitchen(o),'Pedido '+ordLabel(o),o.id);
  }else if(t==='b'){const os=S.orders.filter(o=>(ev.ids||[]).includes(o.id));if(os.length&&!hist&&hasC())enqueue(ticketBill(placeName(os[0]),os),'Conta');
  }else if(t==='z'){S.zAt=Math.max(S.zAt,ev.at||0);S.orders=S.orders.filter(o=>o.at>S.zAt);S.seq=S.orders.reduce((a,o)=>Math.max(a,o.seq||0),0);
  }else return;
  save();paint()}
async function flush(){if(flushing||!linked()||!S.out.length)return;flushing=true;const code=S.settings.code;
  const batch=[];let size=2;for(const ev of S.out){const n=new Blob([JSON.stringify(ev)]).size+1;if(batch.length&&size+n>3400)break;batch.push(ev);size+=n}
  try{const r=await fetch(NTFY,{method:'POST',body:JSON.stringify({topic:'cuscuzeira-'+code,message:JSON.stringify(batch)})});
    if(!r.ok)throw new Error(r.status===429?'limite':'falha '+r.status);
    const ids=batch.map(e=>e.e);S.out=S.out.filter(e=>!ids.includes(e.e));outErr='';save()}
  catch(e){outErr=(e&&e.message==='limite')?'limite':'rede'}
  flushing=false;paintTop();if(S.out.length&&!outErr)flush()}
function take(msg,hist){let m;try{m=JSON.parse(msg)}catch(x){return}(Array.isArray(m)?m:[m]).forEach(ev=>{try{apply(ev,false,hist)}catch(e){}})}
async function connect(){const my=++conn;if(es){es.close();es=null}online=false;paintTop();const code=S.settings.code;if(!code)return;
  const retry=()=>setTimeout(()=>{if(my===conn)connect()},4000);
  if(S.hist){ // primeira vez com este código: pega o que já aconteceu hoje, sem imprimir nada
    try{const r=await fetch(NTFY+topic()+'/json?poll=1&since=12h');if(!r.ok)throw 0;const txt=await r.text();if(my!==conn)return;
      let last=null;txt.split('\n').forEach(line=>{if(!line.trim())return;let d;try{d=JSON.parse(line)}catch(e){return}if(d.event!=='message')return;last=d.id;take(d.message,true)});
      S.hist=false;S.lastMsg=last;save();render()}
    catch(e){if(my===conn)retry();return}}
  if(my!==conn)return;
  const src=new EventSource(NTFY+topic()+'/sse?since='+encodeURIComponent(S.lastMsg||'30s'));es=src;
  src.onopen=()=>{if(es!==src)return;online=true;paintTop();flush()};
  src.onerror=()=>{if(es!==src)return;online=false;src.close();es=null;paintTop();retry()};
  src.onmessage=e=>{if(es!==src)return;let d;try{d=JSON.parse(e.data)}catch(x){return}if(d.event!=='message')return;S.lastMsg=d.id;take(d.message,false);save()}}
function setCode(c){S.settings.code=c;S.out=[];S.lastMsg=null;S.hist=!!c;outErr='';save();connect()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!es&&linked())connect();pump();flush();paint()}});
window.addEventListener('online',()=>{if(!es&&linked())connect();flush()});

// ---------- topo: situação da internet e da impressora ----------
function alertsHTML(){const out=[];
  if(S.pq.length&&(pErr||prStatus()!=='ok'))out.push(`<div class="alert"><span>🖨 A impressora não imprimiu. ${pl(S.pq.length,'papel esperando','papéis esperando')}. ${esc(pErr||'')}</span><button data-act="pumpNow">Tentar agora</button><button data-act="pqClear">Apagar fila</button></div>`);
  if(linked()&&S.out.length&&outErr)out.push(`<div class="alert amber"><span>${outErr==='limite'?'Limite de avisos atingido por agora.':'Sem internet.'} ${pl(S.out.length,'aviso ainda não chegou','avisos ainda não chegaram')} nos outros celulares. Tentando de novo sozinho…</span></div>`);
  const late=S.orders.filter(kLate);
  if(late.length)out.push(`<div class="alert"><span>⚠ A cozinha NÃO imprimiu: ${esc([...new Set(late.map(placeName))].join(', '))}. Veja se o celular da cozinha está ligado, com o app aberto e a impressora ligada.</span><button data-act="resendLate">Mandar de novo</button></div>`);
  return out.join('')}
let lastAlerts='';
function paintTop(){
  $('#brandSub').textContent=S.settings.store+(S.settings.name?' · '+S.settings.name:'');
  const n=$('#netPill');
  if(!linked()){n.className='pill';n.textContent='Só este celular'}
  else if(online){n.className='pill ok';n.textContent='● Ligado'+(S.out.length?' · enviando':'')}
  else{n.className='pill bad';n.textContent='● Sem internet'}
  const p=$('#prPill'),st=prStatus();p.hidden=st==='off';
  if(st==='ok'){p.className='pill ok';p.textContent='🖨 Impressora pronta'}
  else if(st==='perm'){p.className='pill wait';p.textContent='🖨 Toque pra liberar'}
  else{p.className='pill bad';p.textContent='🖨 Impressora desligada'}

  ${un.length?`<div class="kv"><span class="label">Falta pagar</span><span class="big" style="color:var(--danger)">${brl(tot)}</span></div>
   <div class="field"><span class="label">Receber — toque em como o cliente pagou</span><div class="pay">${PAYS.map((p,i)=>`<button class="p${i} ${payMethod===p?'on':''}" data-act="payM" data-v="${p}">${p}</button>`).join('')}</div></div>
   ${payMethod?`<div class="card">${payMethod==='Dinheiro'?`<div class="field"><label class="label" for="recv">Valor que o cliente deu (pra calcular o troco)</label><input id="recv" inputmode="decimal" placeholder="ex: 50,00"><b id="troco" class="num" style="font-size:18px"></b></div>`:''}
    <button class="btn ok block huge" data-act="payConfirm">Confirmar ${brl(tot)} no ${payMethod}</button></div>`:''}`
  :`<div class="kv"><span class="label">Tudo pago</span><span class="big" style="color:var(--ok)">${brl(sumOrders(os))}</span></div>
   <button class="btn ok block huge" data-act="freeConta" data-v="${esc(key)}">${m?'Cliente foi embora · liberar mesa':'Cliente já pegou · tirar da tela'}</button>`}
  <button class="btn block" data-act="printBill" data-v="${esc(key)}">Imprimir a conta</button>`);sheetKey=keep}
function startOrder(m,conta){if(mesa!==m||pendingConta!==(conta||null))cart=[];mesa=m;pendingConta=conta||null;cliName='';cat='C';view='pedido';closeSheet();render();$('#main').scrollTop=0}

// ---------- eventos ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  if(a==='scrim'){if(e.target===el)closeSheet();return}
  if(a==='close')return closeSheet();
  if(a==='go'){view=v;closeSheet();render();$('#main').scrollTop=0;return}
  if(a==='back'){view='mesas';render();return}
  // configuração
  if(a==='station'){const st=S.settings;st.station=v;if(v!=='n'&&st.print==='none')st.print=APP?'app':'usb';if(v==='n')S.pq=[];pErr='';save();if(!st.setup)setupStep=2;render();pump();return}
  if(a==='setupBack'){setupStep=1;render();return}
  if(a==='genCode'){setCode(genCode());S.settings.setup=true;save();view='ajustes';render();toast('Código criado. Coloque ele nos outros celulares.');return}
  if(a==='solo'){S.settings.setup=true;save();view='mesas';render();return}
  if(a==='unlink'){$('#unlinkConfirm').innerHTML=`<div class="card" style="border-color:var(--danger)"><b>Desligar mesmo?</b><span class="note">Este celular para de receber e mandar pedidos pros outros.</span><div class="two"><button class="btn" data-act="go" data-v="ajustes">Não</button><button class="btn red" data-act="unlinkYes">Sim, desligar</button></div></div>`;return}
  if(a==='unlinkYes'){setCode('');render();return}
  if(a==='prTap'){if(prStatus()==='perm'){try{window.AndroidPrinter.requestPermission()}catch(x){}toast('Toque em OK na janela que abriu');setTimeout(()=>{pump();paintTop()},2500)}else{view='ajustes';render()}return}
  if(a==='liberar'){try{window.AndroidPrinter.requestPermission()}catch(x){}toast('Toque em OK na janela que abriu');setTimeout(()=>{pump();render()},2500);return}
  if(a==='pumpNow'){permAsked=false;pErr='';pump();setTimeout(paintTop,800);return}
  if(a==='pqClear'){S.pq=[];pErr='';save();paint();return}
  if(a==='resendLate'){S.orders.filter(kLate).forEach(o=>emit({t:'r',id:o.id}));toast('Mandei de novo pra cozinha');return}
  if(a==='pm'){S.settings.print=v;pErr='';save();render();pump();return}
  if(a==='usbConnect')return usbConnect();
  if(a==='diagRef'){const d=$('#diag');if(d)d.textContent=diagText();return}
  if(a==='testPrint'){const L=[{t:'TESTE',big:true,center:true},{t:plain(S.settings.store),center:true},{t:rule()},{t:'Impressora funcionando!'},{t:hasK()&&hasC()?'Cozinha e caixa':hasK()?'Impressora da COZINHA':'Impressora do CAIXA',bold:true},{t:'1234567890'.repeat(4).slice(0,W())}];
    const out=$('#testOut');Promise.resolve().then(()=>doPrint(L)).then(r=>{if(out)out.textContent=r==='ok'?'Teste enviado pra impressora.':'Não imprimiu: '+r;paintTop()}).catch(x=>{if(out)out.textContent='Não imprimiu: '+(x.message||x)});return}
  // mesas e pedido
  if(a==='mesaNew')return startOrder(+v,null);
  if(a==='conta'){delPending=null;payMethod=null;return openConta(v)}
  if(a==='addMore'){if(v.startsWith('m:'))startOrder(+v.slice(2),null);else startOrder(0,v);return}
  if(a==='cat'){cat=v;if(view==='ajustes')menuOpen=true;render();return}
  if(a==='item'){const it=S.menu.find(i=>i.id===v);if(it)openItem(it);return}
  if(a==='rm'){const i=draft.rm.indexOf(v);i<0?draft.rm.push(v):draft.rm.splice(i,1);keepObs();renderItem();return}
  if(a==='ad'){const ad=S.addons[+v];const i=draft.add.findIndex(x=>x.name===ad.name);i<0?draft.add.push({...ad}):draft.add.splice(i,1);keepObs();renderItem();return}
  if(a==='sabor'){draft.sabor=draft.sabor===v?'':v;keepObs();renderItem();return}
  if(a==='dret'){draft.ret=v==='1';keepObs();renderItem();return}
  if(a==='qty'){draft.qty=Math.max(1,draft.qty+ +v);keepObs();renderItem();return}
  if(a==='addToCart'){keepObs();if(draft.cat==='J'){if(!draft.sabor){toast('Escolha o sabor do suco');return}draft.obs=draft.sabor.toLowerCase()+(draft.obs?'; '+draft.obs:'')}const d=draft;delete d.sabor;delete d.ing;cart.push(d);draft=null;closeSheet();render();toast('Colocado no pedido');return}
  if(a==='openCart')return openCart();
  if(a==='cartQty'){const ci=$('#cliIn');if(ci)cliName=ci.value;const [i,dq]=v.split(':').map(Number);const l=cart[i];if(!l)return;l.qty+=dq;if(l.qty<1)cart.splice(i,1);cart.length?openCart():closeSheet();render();return}
  if(a==='lret'){const ci=$('#cliIn');if(ci)cliName=ci.value;const l=cart[+v];if(l){l.ret=!l.ret;openCart()}return}
  if(a==='send')return sendOrder();
  // conta
  if(a==='reK'){const o=S.orders.find(o=>o.id===v);if(!o)return;if(!hasK()&&!linked()){toast('Este celular não tem impressora da cozinha');return}emit({t:'r',id:o.id});toast(hasK()?'Imprimindo de novo':'Pedi pra cozinha imprimir de novo');return}
  if(a==='delOrder'){delPending=v;openConta(sheetKey);return}
  if(a==='delNo'){delPending=null;openConta(sheetKey);return}
  if(a==='delYes'){const o=S.orders.find(o=>o.id===v);delPending=null;if(!o)return;const k=keyOf(o);emit({t:'d',id:v});toast('Pedido '+ordLabel(o)+' apagado');if(liveByKey(k).length)openConta(k);else closeSheet();return}
  if(a==='payM'){payMethod=v;openConta(sheetKey);const r=$('#recv');if(r)r.focus();return}
  if(a==='payConfirm'){const os=ordersByKey(payKey);if(!os.length||!payMethod){closeSheet();return}const rv=$('#recv');const recv=rv?parseBRL(rv.value):0;const p=payMethod,title=placeName(os[0]);payMethod=null;closeSheet();
    emit({t:'p',ids:os.map(o=>o.id),p,at:Date.now(),recv});toast(title+' · pago no '+p);return}
  if(a==='freeConta'){const ids=S.orders.filter(o=>o.status==='pago'&&!o.freed&&keyOf(o)===v).map(o=>o.id);closeSheet();if(ids.length)emit({t:'f',ids});return}
  if(a==='printBill'){const os=liveByKey(v);if(!os.length)return;if(!hasC()&&!linked()){toast('Este celular não tem impressora do caixa');return}emit({t:'b',ids:os.map(o=>o.id)});toast(hasC()?'Imprimindo a conta':'Conta enviada pra impressora do caixa');return}
  // caixa
  if(a==='printDay'){if(!hasPrinter()){toast('Este celular não tem impressora');return}enqueue(ticketDay(daySummary()),'Resumo do dia');toast('Imprimindo o resumo');return}
  if(a==='closeDay'){const s=daySummary();$('#closeConfirm').innerHTML=`<div class="card" style="border:2px solid var(--danger)"><b>Fechar o dia?</b><span class="note">Apaga os ${s.count} pedidos de hoje em <b>todos os celulares</b> e zera a numeração.${s.open?` Ainda falta receber <b>${brl(s.open)}</b>.`:''} Imprima o resumo antes.</span><div class="two"><button class="btn" data-act="cancelClose">Cancelar</button><button class="btn red" data-act="confirmClose">Sim, fechar o dia</button></div></div>`;return}
  if(a==='cancelClose'){$('#closeConfirm').innerHTML='';return}
  if(a==='confirmClose'){const s=daySummary();S.history.push({date:new Date().toISOString().slice(0,10),paid:s.paid,by:s.by,count:s.count});if(S.history.length>400)S.history.shift();emit({t:'z',at:Date.now()});toast('Dia fechado');return}
  // cardápio
  if(a==='addAddon'){S.addons.push({name:'Novo adicional',price:ADD_PRICE});save();render();return}
  if(a==='delAddon'){S.addons.splice(+v,1);save();render();return}
  if(a==='addItem'){const nums=S.menu.filter(i=>i.cat===cat).map(i=>i.num);const n=(nums.length?Math.max(...nums):0)+1;S.menu.push({id:cat+n,cat,num:n,name:'Novo item',ing:[],price:0});menuOpen=true;save();render();return}
  if(a==='delItem'){S.menu.splice(+v,1);menuOpen=true;save();render();return}
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.dataset.form==='code'){const c=$('#codeIn').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<6){toast('Código muito curto. Copie igual ao do outro celular.');return}setCode(c);S.settings.setup=true;save();view='mesas';render();toast('Ligado com o código '+c.toUpperCase());return}
  if(e.target.dataset.form==='quick'){const raw=$('#quickNum').value.trim().toUpperCase();if(!raw)return;
    const m=raw.match(/^([A-Z])?\s*(\d+)$/);if(!m){toast('Digite só o número do cardápio, ex: 7 ou 24');return}
    const c=m[1]||cat;const it=S.menu.find(i=>i.cat===c&&i.num===+m[2])||(!m[1]&&S.menu.find(i=>(i.cat==='C'||i.cat==='T')&&i.num===+m[2]));if(!it){toast('Não achei o nº '+raw);return}
    $('#quickNum').value='';$('#quickNum').blur();openItem(it)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.set){if(t.dataset.set==='tables')S.settings.tables=Math.max(1,Math.min(60,parseInt(t.value)||1));else if(t.dataset.set==='name')S.settings.name=t.value.trim().slice(0,14);else S.settings.store=t.value.trim()||'Lanchonete';save();paintTop();return}
  if(t.dataset.addon!==undefined){const a=S.addons[+t.dataset.addon];if(!a)return;if(t.dataset.k==='price')a.price=parseBRL(t.value);else a.name=t.value.trim();save();return}
  if(t.dataset.menu!==undefined){const it=S.menu[+t.dataset.menu];if(!it)return;const k=t.dataset.k;
    if(k==='price')it.price=parseBRL(t.value);else if(k==='num'){it.num=parseInt(t.value)||it.num;it.id=it.cat+it.num}else if(k==='ing')it.ing=t.value.split(',').map(s=>s.trim()).filter(Boolean);else it.name=t.value.trim();save();return}
});
document.addEventListener('toggle',e=>{if(e.target.id==='menuDet')menuOpen=e.target.open},true);
document.addEventListener('input',e=>{if(e.target.id==='cliIn'){cliName=e.target.value;return}if(e.target.id==='recv'){const r=parseBRL(e.target.value);const tr=r-payTotal;const el=$('#troco');el.textContent=r?(tr>=0?'Troco: '+brl(tr):'Faltam '+brl(-tr)):'';el.style.color=tr>=0?'var(--ok)':'var(--danger)'}});

save();render();connect();pump();
})();
</script>
</body></html>
